<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macroxel</title>
<style>html,body{margin:0;width:100%;height:100%;background:#03142b}body{visibility:hidden}</style>
</head>
<body>
<script>
(()=>{
  const SOURCE=location.origin+'/ECOSISTEMA-MACROXEL-HOSPITAL/MACROXEL-VISORES-CENTRAL/TRANSFERENCIAS/index.html';
  const CACHE_KEY=SOURCE;
  const render=(html)=>{document.open();document.write(html);document.close();};
  (async()=>{
    try{
      const r=await fetch(SOURCE+'?mx='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const html=await r.text();
      if(!html || !/<html[\s>]/i.test(html)) throw new Error('Contenido inválido');
      if('caches' in window){
        try{
          const c=await caches.open('macroxel-hospital-central');
          await c.put(CACHE_KEY,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
        }catch(_){}
      }
      render(html);
    }catch(err){
      if('caches' in window){
        try{
          const cached=await caches.match(CACHE_KEY);
          if(cached){render(await cached.text());return;}
        }catch(_){}
      }
      document.body.style.visibility='visible';
      document.body.innerHTML='<div style="font:600 15px system-ui;color:#fff;text-align:center;padding:28px">No se pudo cargar Macroxel Hospital.<br>Verifica la conexión a Internet.</div>';
    }
  })();
})();
</script>
</body>
</html>
